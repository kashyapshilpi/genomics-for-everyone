name: Translation
description: Offer to translate the app into an Indian language.
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "Hindi, Telugu, Tamil, Bengali..."
    validations: { required: true }
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Your experience with medical translation, and anything we should know.
